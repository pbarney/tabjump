<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabJump</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <img src="icons/icon-32.png" alt="" width="32" height="32">
      <h1>Jump Slots</h1>
    </div>
    <button id="open-options" type="button" title="Open options">Options</button>
  </header>

  <main>
    <div id="slots" class="slots" aria-live="polite"></div>

    <div class="actions">
      <button id="unassign-current" type="button">Unassign Current Tab</button>
      <button id="clear-all" type="button">Clear All</button>
    </div>

    <p id="status" class="status" role="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>

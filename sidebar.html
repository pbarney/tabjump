<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabJump Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="sidebar-header">
    <div class="sidebar-brand">
      <img src="icons/icon-32.png" alt="" width="24" height="24">
      <h1>TabJump</h1>
    </div>
    <span id="scope-label" class="scope-label">Loading…</span>
  </header>
  <main>
    <p class="sidebar-hint">Your jump slots</p>
    <ol id="sidebar-slots" class="sidebar-slots" aria-label="Jump slots"></ol>
  </main>
  <footer class="sidebar-footer">
    <p>Click a numbered slot to jump to its tab.</p>
    <button id="open-options" type="button">Options</button>
  </footer>
  <p id="sidebar-status" class="status" role="status" aria-live="polite"></p>
  <script src="platform.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabJump Options</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>TabJump</h1>

    <section>
      <h2>Slot Scope</h2>
      <label>
        <input type="radio" name="slot-scope" value="global" checked>
        Global across all windows
      </label>
      <label class="disabled">
        <input type="radio" name="slot-scope" value="per-window" disabled>
        Per-window slots (roadmap)
      </label>
    </section>

    <section>
      <h2>Shortcuts</h2>
      <p>Firefox manages the actual keyboard shortcuts for this extension.</p>
      <button id="manage-shortcuts" type="button">Manage Extension Shortcuts</button>
      <button id="open-popup-tab" type="button">Open Popup as Tab</button>
    </section>

    <section>
      <h2>Tree Style Tab Badges</h2>
      <label>
        <input id="show-tst-badges" type="checkbox">
        Show Jump Slot badges in Tree Style Tab
      </label>
    </section>

    <section>
      <h2>Feedback</h2>
      <label>
        <input id="show-action-badge-feedback" type="checkbox">
        Briefly flash tab assignments on the TabJump toolbar icon
      </label>
    </section>

    <section>
      <h2>Data</h2>
      <button id="clear-all" type="button">Clear All Jump Slots</button>
    </section>

    <p id="status" role="status"></p>
  </main>

  <script src="options.js"></script>
</body>
</html>
